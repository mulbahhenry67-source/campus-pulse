server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long cache, content-hashed filenames make this safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker and manifest must always revalidate, never be stale-cached.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache";
    }

    # Reverse proxy to the backend container on the shared Docker network.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s; # keep long-lived WebSocket connections open
    }

    # SPA fallback: any unmatched route serves index.html so client-side
    # routing (React Router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers at the edge, in addition to helmet on the API itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
