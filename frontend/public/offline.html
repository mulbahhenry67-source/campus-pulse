<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Pulse — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f6f3fc;
        color: #1c1230;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.5rem; margin-bottom: 8px; }
      p { color: #4a2280; max-width: 320px; }
      button {
        margin-top: 20px;
        background: #5b2a9e;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>Campus Pulse needs a connection to load matches and messages. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
